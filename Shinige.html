<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>死にゲー</title>

<style>
html,body{
  margin:0;
  padding:0;
  overflow:hidden;
  background:#000;
  touch-action:none;
}

canvas{display:block;}

#jump{
  position:fixed;
  bottom:14px;
  left:50%;
  transform:translateX(-50%);
  width:84px;
  height:84px;
  border-radius:50%;
  background:rgba(0,0,0,0.6);
  color:#fff;
  font-size:18px;
  border:none;
  touch-action:manipulation;
}
</style>
</head>

<body>
<canvas id="game"></canvas>
<button id="jump">JUMP</button>

<script>
/* ===== Canvas ===== */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}
resize();
addEventListener("resize", resize);

/* ===== 背景 ===== */
const stars=[], meteors=[];
for(let i=0;i<100;i++){
  stars.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,a:Math.random()});
}
function makeMeteor(){
  return {
    x:Math.random()*canvas.width,
    y:canvas.height+Math.random()*canvas.height,
    len:80+Math.random()*60,
    speed:4+Math.random()*2,
    a:0.6+Math.random()*0.4
  };
}
for(let i=0;i<6;i++) meteors.push(makeMeteor());

/* ===== プレイヤー ===== */
const player={
  x:120,y:0,w:48,h:48,vy:0,onGround:false
};
const gravity=0.8;
const jumpPower=-14;

/* ===== 画像 ===== */
const img=new Image();
img.src="Agj.png";

/* ===== 地面 ===== */
const floorY=()=>canvas.height*0.6;

/* ===== トゲ ===== */
let spikes=[],scrollX=0,speed=4;
for(let i=600;i<5000;i+=260){
  spikes.push({x:i,w:40,h:40});
}

/* ===== 入力 ===== */
let jumpReq=false;
document.getElementById("jump").addEventListener("pointerdown",e=>{
  e.preventDefault();
  jumpReq=true;
});

/* ===== 更新 ===== */
function update(){
  scrollX+=speed;

  if(jumpReq && player.onGround){
    player.vy=jumpPower;
    player.onGround=false;
  }
  jumpReq=false;

  player.vy+=gravity;
  player.y+=player.vy;

  if(player.y+player.h>=floorY()){
    player.y=floorY()-player.h;
    player.vy=0;
    player.onGround=true;
  }

  for(const s of spikes){
    const px=player.x+player.w/2;
    const py=player.y+player.h;
    const sx=s.x-scrollX;
    const sy=floorY();
    if(px>sx && px<sx+s.w && py>sy-s.h){
      alert("死");
      location.reload();
    }
  }
}

/* ===== 描画 ===== */
function draw(){
  /* 背景 */
  const bg=ctx.createLinearGradient(0,0,0,canvas.height);
  bg.addColorStop(0,"#020b05");
  bg.addColorStop(1,"#062a16");
  ctx.fillStyle=bg;
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle="#7aff9c";
  for(const s of stars){
    ctx.globalAlpha=s.a;
    ctx.fillRect(s.x,s.y,2,2);
  }
  ctx.globalAlpha=1;

  for(const m of meteors){
    ctx.strokeStyle=`rgba(180,255,120,${m.a})`;
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(m.x,m.y);
    ctx.lineTo(m.x,m.y-m.len);
    ctx.stroke();
    m.y-=m.speed;
    if(m.y<-m.len) Object.assign(m,makeMeteor());
  }

  /* 地面 */
  const fg=ctx.createLinearGradient(0,floorY(),0,canvas.height);
  fg.addColorStop(0,"#0b2f1a");
  fg.addColorStop(1,"#03160c");
  ctx.fillStyle=fg;
  ctx.fillRect(0,floorY(),canvas.width,canvas.height);

  ctx.strokeStyle="rgba(120,255,180,0.6)";
  ctx.beginPath();
  ctx.moveTo(0,floorY());
  ctx.lineTo(canvas.width,floorY());
  ctx.stroke();

  /* プレイヤー */
  if(img.complete){
    ctx.drawImage(img,player.x,player.y,player.w,player.h);
  }else{
    ctx.fillStyle="#f00";
    ctx.fillRect(player.x,player.y,player.w,player.h);
  }

  /* トゲ */
  ctx.fillStyle="#baff5a";
  ctx.shadowColor="#9fff3a";
  ctx.shadowBlur=10;
  for(const s of spikes){
    const x=s.x-scrollX;
    ctx.beginPath();
    ctx.moveTo(x,floorY());
    ctx.lineTo(x+s.w/2,floorY()-s.h);
    ctx.lineTo(x+s.w,floorY());
    ctx.closePath();
    ctx.fill();
  }
  ctx.shadowBlur=0;
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
