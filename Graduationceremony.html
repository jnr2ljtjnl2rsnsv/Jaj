<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>卒業おめでとう</title>

<style>
body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
font-family:sans-serif;
background:linear-gradient(135deg,#ffd6e7,#ffffff,#d6f0ff);
overflow:hidden;
text-align:center;
}

h1{
font-size:60px;
color:#333;
margin:0;
}

p{
font-size:22px;
}

#count{
font-size:28px;
color:#ff4081;
}

.sakura{
position:fixed;
top:-20px;
font-size:24px;
animation:fall linear forwards;
}

@keyframes fall{
to{
transform:translateY(110vh) rotate(360deg);
}
}
</style>
</head>

<body>

<h1>🎓 卒業おめでとう！ 🌸</h1>
<p>みんな今まで本当にありがとう</p>
<p>1分後にメッセージページに移動します</p>

<div id="count">60</div>

<script>

let time=60

const timer=setInterval(()=>{

time--
document.getElementById("count").innerText=time

if(time<=0){
clearInterval(timer)

window.location.href="https://line.me/ti/p/7fNxU4_uWa"
}

},1000)

function sakura(){

const s=document.createElement("div")
s.className="sakura"
s.innerHTML="🌸"

s.style.left=Math.random()*100+"vw"
s.style.animationDuration=(Math.random()*5+5)+"s"

document.body.appendChild(s)

setTimeout(()=>s.remove(),10000)

}

setInterval(sakura,200)

</script>

</body>
</html>
