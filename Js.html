<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>JSゲームメーカー Pro</title>
  <script src="https://unpkg.com/blockly/blockly.min.js"></script>
  <script src="https://unpkg.com/blockly/javascript_compressed.js"></script>
  <script src="https://unpkg.com/blockly/msg/ja.js"></script>
  <style>
    body { margin: 0; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; background: #1a1a1a; color: white; }
    .top-panels { display: flex; height: 25%; background: #fff; color: black; border-bottom: 2px solid #444; }
    #pixel-editor { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-right: 1px solid #ccc; }
    #game-screen { flex: 1; position: relative; background: #333; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    #grid { display: grid; grid-template-columns: repeat(16, 1fr); gap: 1px; background: #ddd; width: 112px; height: 112px; }
    .pixel { width: 6px; height: 6px; background: white; }
    #playerCanvas { width: 64px; height: 64px; image-rendering: pixelated; position: absolute; left: 10px; top: 10px; transform-origin: center; transition: all 0.2s; }
    #blocklyDiv { flex: 2; width: 100%; }
    #code-panel { height: 12%; background: #000; padding: 8px; overflow-y: auto; border-top: 1px solid #444; }
    #codeContent { color: #0f0; font-family: monospace; font-size: 11px; margin: 0; }
    #controls { background: #333; padding: 8px; display: flex; gap: 5px; justify-content: space-around; }
    button { cursor: pointer; padding: 6px 12px; font-weight: bold; border-radius: 4px; border: none; }
    #run-btn { background: #2ecc71; color: white; }
    #dl-btn { background: #3498db; color: white; }
  </style>
</head>
<body>

  <div class="top-panels">
    <div id="pixel-editor">
      <div id="grid"></div>
      <input type="color" id="colorPicker" value="#e74c3c" style="margin-top:3px;">
    </div>
    <div id="game-screen">
      <canvas id="playerCanvas" width="16" height="16"></canvas>
    </div>
  </div>

  <div id="controls">
    <button id="run-btn" onclick="runCode()">テスト実行</button>
    <button id="dl-btn" onclick="downloadGame()">全画面版を保存</button>
  </div>

  <div id="blocklyDiv"></div>
  <div id="code-panel"><pre id="codeContent"></pre></div>

  <xml id="toolbox" style="display: none">
    <category name="うごき" colour="210">
      <block type="move_x"><value name="VAL"><shadow type="math_number"><field name="NUM">50</field></shadow></value></block>
      <block type="move_y"><value name="VAL"><shadow type="math_number"><field name="NUM">50</field></shadow></value></block>
      <block type="rotate"><value name="DEG"><shadow type="math_number"><field name="NUM">90</field></shadow></value></block>
      <block type="wait_sec"><value name="SEC"><shadow type="math_number"><field name="NUM">0.5</field></shadow></value></block>
    </category>
    <category name="ループ" colour="120">
      <block type="controls_repeat_ext"><value name="TIMES"><shadow type="math_number"><field name="NUM">4</field></shadow></value></block>
    </category>
  </xml>

  <script>
    const playerCanvas = document.getElementById('playerCanvas');
    const ctx = playerCanvas.getContext('2d');
    let pixels = Array(256).fill(null);
    const colorPicker = document.getElementById('colorPicker');

    for (let i = 0; i < 256; i++) {
      const div = document.createElement('div'); div.className = 'pixel';
      div.onclick = () => { div.style.backgroundColor = colorPicker.value; pixels[i] = colorPicker.value; draw(); };
      document.getElementById('grid').appendChild(div);
    }
    function draw() {
      ctx.clearRect(0, 0, 16, 16);
      pixels.forEach((c, i) => { if(c){ ctx.fillStyle=c; ctx.fillRect(i%16, Math.floor(i/16), 1, 1); } });
    }

    let pState = { x: 20, y: 20, deg: 0 };
    function updateStyle() {
      playerCanvas.style.left = pState.x + 'px';
      playerCanvas.style.top = pState.y + 'px';
      playerCanvas.style.transform = `rotate(${pState.deg}deg)`;
    }

    Blockly.defineBlocksWithJsonArray([
      { "type": "move_x", "message0": "横に %1 動かす", "args0": [{ "type": "input_value", "name": "VAL", "check": "Number" }], "previousStatement": null, "nextStatement": null, "colour": 210 },
      { "type": "move_y", "message0": "縦に %1 動かす", "args0": [{ "type": "input_value", "name": "VAL", "check": "Number" }], "previousStatement": null, "nextStatement": null, "colour": 210 },
      { "type": "rotate", "message0": "%1 度まわす", "args0": [{ "type": "input_value", "name": "DEG", "check": "Number" }], "previousStatement": null, "nextStatement": null, "colour": 210 },
      { "type": "wait_sec", "message0": "%1 秒待つ", "args0": [{ "type": "input_value", "name": "SEC", "check": "Number" }], "previousStatement": null, "nextStatement": null, "colour": 160 }
    ]);

    const generator = javascript.javascriptGenerator;
    generator.forBlock['move_x'] = (b, g) => `pState.x += ${g.valueToCode(b, 'VAL', javascript.Order.ATOMIC) || 0}; updateStyle();\n`;
    generator.forBlock['move_y'] = (b, g) => `pState.y += ${g.valueToCode(b, 'VAL', javascript.Order.ATOMIC) || 0}; updateStyle();\n`;
    generator.forBlock['rotate'] = (b, g) => `pState.deg += ${g.valueToCode(b, 'DEG', javascript.Order.ATOMIC) || 0}; updateStyle();\n`;
    generator.forBlock['wait_sec'] = (b, g) => `await new Promise(r => setTimeout(r, ${g.valueToCode(b, 'SEC', javascript.Order.ATOMIC) * 1000}));\n`;

    const workspace = Blockly.inject('blocklyDiv', { toolbox: document.getElementById('toolbox') });
    workspace.addChangeListener(() => { document.getElementById('codeContent').textContent = generator.workspaceToCode(workspace); });

    async function runCode() {
      pState = { x: 20, y: 20, deg: 0 }; updateStyle();
      const code = generator.workspaceToCode(workspace);
      try { await eval(`(async () => { ${code} })()`); } catch (e) { console.error(e); }
    }

    function downloadGame() {
      const code = generator.workspaceToCode(workspace);
      const charData = playerCanvas.toDataURL();
      
      const htmlContent = `<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Big Game</title>
  <style>
    body { background: #222; color: white; margin: 0; overflow: hidden; font-family: sans-serif; }
    #stage { width: 100vw; height: 80vh; background: #333; position: relative; overflow: hidden; border-bottom: 2px solid #444; }
    #player { width: 128px; height: 128px; position: absolute; image-rendering: pixelated; transition: all 0.3s ease-in-out; left: 10vw; top: 10vh; }
    #ui { height: 20vh; display: flex; align-items: center; justify-content: center; }
    #btn { padding: 15px 40px; background: #2ecc71; color: white; border: none; border-radius: 50px; font-size: 20px; font-weight: bold; box-shadow: 0 4px #27ae60; }
    #btn:active { transform: translateY(2px); box-shadow: 0 2px #27ae60; }
  </style>
</head>
<body>
  <div id="stage"><img id="player" src="${charData}"></div>
  <div id="ui"><button id="btn" onclick="start()">プログラム開始！</button></div>
  <script>
    let pState = { x: window.innerWidth*0.1, y: window.innerHeight*0.1, deg: 0 };
    const player = document.getElementById('player');
    function updateStyle() {
      player.style.left = pState.x + 'px'; player.style.top = pState.y + 'px';
      player.style.transform = 'rotate(' + pState.deg + 'deg)';
    }
    async function start() {
      pState = { x: window.innerWidth*0.1, y: window.innerHeight*0.1, deg: 0 }; updateStyle();
      ${code}
    }
  <\/script>
</body>
</html>`;

      const blob = new Blob([htmlContent], { type: 'text/html' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'my_fullscreen_game.html';
      a.click();
    }
    draw();
  </script>
</body>
</html>
