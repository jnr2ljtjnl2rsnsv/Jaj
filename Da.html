<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SECURE TEXT</title>

<style>
:root {
  --bg: #040406;
  --panel: #0b0e14;
  --border: #1a2030;
  --accent: #6f7cff;
  --glow: rgba(111,124,255,0.5);
  --text: #e9ecf1;
  --error: #ff4d6d;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at top, #0a0f25, transparent 65%),
    var(--bg);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  color: var(--text);
}

.panel {
  width: 92%;
  max-width: 420px;
  background: linear-gradient(180deg, #0d1220, #07090f);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 24px 20px 26px;
  box-shadow:
    0 25px 70px rgba(0,0,0,0.85),
    inset 0 0 30px rgba(111,124,255,0.05);
}

.title {
  text-align: center;
  font-size: 12px;
  letter-spacing: 0.35em;
  color: var(--accent);
  margin-bottom: 26px;
}

input {
  width: 100%;
  padding: 16px;
  font-size: 16px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: #06080e;
  color: var(--text);
  outline: none;
}

input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 14px var(--glow);
}

button {
  width: 100%;
  margin-top: 18px;
  padding: 16px;
  font-size: 15px;
  letter-spacing: 0.2em;
  border-radius: 12px;
  border: none;
  background: linear-gradient(135deg, #5b68ff, #7f88ff);
  color: #fff;
  font-weight: 600;
  cursor: pointer;
  transition: 0.15s ease;
}

button:active {
  transform: scale(0.98);
  filter: brightness(1.1);
}

.error {
  text-align: center;
  margin-top: 14px;
  font-size: 13px;
  color: var(--error);
}

#content {
  display: none;
  margin-top: 24px;
  padding: 18px;
  border-radius: 14px;
  background: rgba(8,10,18,0.85);
  border: 1px solid var(--border);
  font-size: 14px;
  line-height: 1.8;
  white-space: pre-wrap;
}
</style>
</head>

<body>
  <div class="panel">
    <div class="title">SECURE ACCESS</div>

    <input
      type="password"
      id="pw"
      placeholder="PASSWORD"
      autocomplete="off"
    >

    <button onclick="unlock()">UNLOCK</button>

    <div id="error" class="error"></div>

    <div id="content">
天河の成績:30人ゲームオプ1つ乗っ取り
    </div>
  </div>

<script>
const PASSWORD = "LNDS";

function unlock() {
  const pw = document.getElementById("pw").value;
  const content = document.getElementById("content");
  const error = document.getElementById("error");

  if (pw === PASSWORD) {
    content.style.display = "block";
    error.textContent = "";
  } else {
    error.textContent = "ACCESS DENIED";
  }
}
</script>
</body>
</html>
