<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>検証中</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;height:100vh;display:grid;place-items:center;
  background:#0b0b0b;color:#e6e6e6;font-family:system-ui;overflow:hidden
}
.card{
  width:min(92vw,520px);padding:28px 26px 26px;border-radius:18px;
  background:linear-gradient(180deg,#111,#0a0a0a);
  box-shadow:0 20px 60px rgba(0,0,0,.7),
             inset 0 0 0 1px rgba(255,255,255,.04)
}
h1{margin:0 0 10px;font-size:1.2rem;letter-spacing:.08em;color:#9ef}
.muted{opacity:.65;font-size:.9rem}
.bar{height:10px;border-radius:999px;background:#111;overflow:hidden;margin:16px 0}
.bar>i{display:block;height:100%;width:0;
  background:linear-gradient(90deg,#6cf,#f6f);transition:width .25s}
.overlay{
  position:fixed;inset:0;display:grid;place-items:center;
  background:rgba(0,0,0,.88);opacity:0;pointer-events:none;
  transition:opacity .4s
}
.overlay.show{opacity:1;pointer-events:auto}
.big{font-size:clamp(1.8rem,6vw,3rem);letter-spacing:.2em}
.muted.small{font-size:.9rem;opacity:.75}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 20% 30%,rgba(0,255,255,.08),transparent 40%),
    radial-gradient(circle at 80% 70%,rgba(255,0,255,.08),transparent 40%);
  animation:bgMove 8s linear infinite alternate;
  pointer-events:none;
}

@keyframes bgMove{
  from{transform:translate(0,0)}
  to{transform:translate(-40px,-30px)}
}

body::after{
  content:"";
  position:fixed;
  inset:0;
  background:linear-gradient(
    rgba(255,255,255,.03) 50%,
    transparent 50%
  );
  background-size:100% 4px;
  pointer-events:none;
}

.glitch{
  animation:glitch 0.2s infinite alternate;
}

@keyframes glitch{
  from{transform:translate(1px,-1px)}
  to{transform:translate(-1px,1px)}
}

.cursor::after{
  content:"_";
  animation:blink 1s infinite;
}

@keyframes blink{
  50%{opacity:0}
}

</style>
</head>

<body>

<div class="card">
  <h1>アクセス検証</h1>
  <div class="muted">自動チェックを実行しています。しばらくお待ちください。</div>
  <div class="bar"><i id="prog"></i></div>
</div>

<div id="ov" class="overlay">
  <div style="text-align:center;max-width:90vw">
    <div class="big">特 定 完 了</div>
    <div style="text-align:left;background:#000;border-radius:14px;
      padding:16px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);margin-top:12px">
      <div class="muted small" style="margin-bottom:6px">取得情報（自動）</div>
      <ul id="infoList" style="list-style:none;padding:0;margin:0;line-height:1.7">
        <li>位置情報: <b id="geo">取得中…</b></li>
        <li>ログID: <b id="logid">—</b></li>
        <li>端末: <b id="ua">—</b></li>
        <li>OS推定: <b id="os">—</b></li>
        <li>画面: <b id="scr">—</b></li>
        <li>言語: <b id="lang">—</b></li>
        <li>タイムゾーン: <b id="tz">—</b></li>
        <li>滞在時間: <b id="stay">—</b></li>
        <li>信頼スコア: <b id="score">—</b></li>
      </ul>
    </div>
  </div>
</div>

<script>
const API = 'https://shareware-afford-accessories-shade.trycloudflare.com';

const prog = document.getElementById('prog');
const ov = document.getElementById('ov');
const geoEl = document.getElementById('geo');
const logid = document.getElementById('logid');
const ua = document.getElementById('ua');
const os = document.getElementById('os');
const scr = document.getElementById('scr');
const lang = document.getElementById('lang');
const tz = document.getElementById('tz');
const stay = document.getElementById('stay');
const score = document.getElementById('score');

let percent = 0;
let startTime = Date.now();

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

function updateStay(){
  stay.textContent = Math.floor((Date.now()-startTime)/1000)+"秒";
}
setInterval(updateStay,500);

async function cinematicProgress(){
  while(percent < 100){
    percent += (percent < 70)
      ? Math.random()*6
      : Math.random()*2;

    prog.style.width = percent+"%";

    if(percent > 85){
      prog.style.background =
        "linear-gradient(90deg,#ff004c,#ff00ff)";
    }

    await sleep(120);
  }
}

function typeEffect(el,text,speed=25){
  return new Promise(resolve=>{
    el.textContent="";
    el.classList.add("cursor");
    let i=0;
    const t=setInterval(()=>{
      el.textContent+=text[i];
      i++;
      if(i>=text.length){
        clearInterval(t);
        el.classList.remove("cursor");
        resolve();
      }
    },speed);
  });
}

async function run(){

  document.querySelector("h1").textContent="INITIALIZING...";
  await sleep(600);
  document.querySelector("h1").textContent="ACCESS SCAN";

  const payload = {
    ua: navigator.userAgent,
    os: (/(Windows|Mac|Linux|Android|iPhone|iPad)/.exec(navigator.userAgent)||['Unknown'])[0],
    screen: `${screen.width}×${screen.height}`,
    lang: navigator.language,
    tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
    score: 70 + Math.floor(Math.random()*25)
  };

  cinematicProgress();

  await sleep(1200);

  await typeEffect(ua,payload.ua,8);
  await typeEffect(os,payload.os,30);
  await typeEffect(scr,payload.screen,30);
  await typeEffect(lang,payload.lang,30);
  await typeEffect(tz,payload.tz,30);
  await typeEffect(score,String(payload.score),40);

  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      async pos=>{
        const g=`${pos.coords.latitude.toFixed(5)},${pos.coords.longitude.toFixed(5)}`;
        await typeEffect(geoEl,g,40);
      },
      async ()=>{
        await typeEffect(geoEl,"拒否 / 不可",40);
      },
      {timeout:1500}
    );
  }

  await sleep(2000);

  ov.classList.add("show");
  document.querySelector(".big").classList.add("glitch");
}

run();
</script>
</body>
</html>
