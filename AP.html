<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ミニゲーム</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #111;
      font-family: sans-serif;
      color: white;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 40px;
      letter-spacing: 4px;
      text-shadow: 0 0 15px rgba(255,255,255,0.4);
    }

    button {
      font-size: 108px;
      padding: 90px 300px;
      background: #00ff88;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(0,255,136,0.7);
      transition: transform 0.1s, box-shadow 0.1s;
    }

    button:hover {
      transform: scale(1.08);
      box-shadow: 0 0 45px rgba(0,255,136,1);
    }

    button:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <h1>ミニゲーム</h1>

  <button onclick="start()">スタート</button>

  <script>
    function start() {
      window.location.href = "https://jnr2ljtjnl2rsnsv.github.io/Jaj/crash.html";
    }
  </script>

</body>
</html>
